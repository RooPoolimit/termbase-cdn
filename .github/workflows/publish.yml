name: Publish Termbase

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: write

concurrency:
  group: publish-termbase
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s source/requirements.txt ]; then
            pip install -r source/requirements.txt
          fi

      - name: Publish from source snapshot
        run: |
          python source/publish_from_source.py --mode "${{ inputs.mode }}"

      - name: Show generated diff
        if: inputs.mode == 'apply'
        run: |
          git status --short
          git diff -- api/termbase/compiled api/termbase/version || true

      - name: Commit and push generated API files
        if: inputs.mode == 'apply'
        run: |
          if git diff --quiet -- api/termbase/compiled api/termbase/version; then
            echo "No api/termbase changes to commit."
            exit 0
          fi

          VERSION="$(python - <<'PY'
          import json
          with open("api/termbase/version", "r", encoding="utf-8") as f:
              print(json.load(f).get("termbase_version", "unknown"))
          PY
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/termbase/compiled api/termbase/version
          git commit -m "publish termbase ${VERSION} (via Action)"
          git push
